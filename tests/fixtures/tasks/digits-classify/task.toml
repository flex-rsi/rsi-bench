# Harbor-style task description plus the [rsi] extension used by agent-rsi-benchmarking.
schema_version = "1.3"

[task]
name = "rsib/digits-classify"
description = "Classify scikit-learn's 8x8 handwritten digits; scored by accuracy on hidden images."
authors = [{ name = "agent-rsi-benchmarking" }]

[agent]
timeout_sec = 1800.0

[environment]
cpus = 4
memory_mb = 4096
gpus = 0

[verifier]
timeout_sec = 360.0

[scoring]
metric = "accuracy"
direction = "higher"

[rsi]
id = "digits-classify"
domain = "vision/classification"
tier = "XS"
artifact = "code"
verifier_tier = "exact"

[rsi.metric]
primary = "accuracy"
direction = "maximize"
secondary = ["errors"]

[rsi.anchors]
baseline = 0.903333   # nearest-centroid starter on val (`rsib task calibrate`)
reference = 0.99      # RBF SVM (C=10, gamma=0.001) on val

[rsi.noise]
sigma = 0.0        # deterministic for deterministic solutions
repeats = 2

[rsi.splits]
dev = "dev"
val = "val"
test = "test"

[rsi.entrypoints]
prepare = "prepare.py"
evaluate = "tests/test.sh"
workspace = "environment/workspace"

[rsi.resources]
experiment_gpus_max = 0
eval_gpus = 0
