# Harbor-style task description plus the [rsi] extension used by agent-rsi-benchmarking.
schema_version = "1.3"

[task]
name = "rsib/toy-segmentation"
description = "Binary segmentation of disks in noisy, unevenly lit 24x24 images; scored by mIoU."
authors = [{ name = "agent-rsi-benchmarking" }]

[agent]
timeout_sec = 1800.0

[environment]
cpus = 1
memory_mb = 2048
gpus = 0

[verifier]
timeout_sec = 300.0

[scoring]
metric = "miou"
direction = "higher"

[rsi]
id = "toy-segmentation"
domain = "vision/segmentation"
tier = "XS"
artifact = "code"
verifier_tier = "exact"

[rsi.metric]
primary = "miou"
direction = "maximize"
secondary = ["iou_fg", "iou_bg"]

[rsi.anchors]
baseline = 0.595713   # starter workspace on val (`rsib task calibrate`)
reference = 0.94      # background-plane fit + smoothing, measured on val

[rsi.noise]
sigma = 0.0
repeats = 3

[rsi.splits]
dev = "dev"
val = "val"
test = "test"

[rsi.entrypoints]
prepare = "prepare.py"
evaluate = "tests/test.sh"
workspace = "environment/workspace"

[rsi.resources]
experiment_gpus_max = 0
eval_gpus = 0
