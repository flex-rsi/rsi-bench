[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-rsi-benchmarking"
version = "1.0.0"
description = "A benchmark for recursive self-improvement of agent harnesses: a shared executor/improver harness, a frozen orchestrator, and git-native experiment records."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Flex-RSI" }]
keywords = ["benchmark", "agents", "recursive self-improvement", "llm", "harness"]
dependencies = [
  "jsonschema>=4.17",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.60"]
openai = ["openai>=1.40"]
dev = ["pytest>=8"]
tasks = ["numpy>=1.24", "scikit-learn>=1.3", "pillow>=10"]   # vsearch evaluates with Pillow; the test fixtures use numpy and scikit-learn
all = ["anthropic>=0.60", "openai>=1.40", "pytest>=8"]

[project.urls]
Repository = "https://github.com/flex-rsi/rsi-bench"
Changelog = "https://github.com/flex-rsi/rsi-bench/blob/main/CHANGELOG.md"

[project.scripts]
rsib = "rsibench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rsibench = ["schemas/*.json", "models/pricing.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slurm: needs a live SLURM controller (set RSIB_TEST_SLURM=1)",
  "live_model: calls a real model API (set RSIB_TEST_LIVE_MODEL=<adapter:model>)",
]
