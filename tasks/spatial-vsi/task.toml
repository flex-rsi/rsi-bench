# VSI-Bench (Thinking in Space, arXiv:2412.14171): spatial reasoning from egocentric indoor video.
# Fixed-backbone track: the solution may call the run's model and no other model. The artifact is
# solver.py, which calls the model when it is evaluated.

schema_version = "1.3"

[task]
name = "rsib/spatial-vsi"
description = "Answer VSI-Bench spatial questions (counts, distances, sizes, directions, routes, order) about indoor videos with the run's model"
authors = [{ name = "Flex-RSI" }]

[agent]
timeout_sec = 36000.0

[environment]
cpus = 16
memory_mb = 32768
gpus = 0

[verifier]
timeout_sec = 15000.0           # the solver's own 4 h limit (tests/evaluate.py) + margin; val has 480 questions

[scoring]
metric = "score"
direction = "higher"

[rsi]
id = "spatial-vsi"
domain = "reasoning/spatial-video"
tier = "S"
artifact = "code"
verifier_tier = "exact"

[rsi.metric]
primary = "score"               # official VSI-Bench overall (macro over 8 groups), in [0, 1]
direction = "maximize"
secondary = ["debiased_score"]
public = ["debiased_score", "questions", "answered", "model_calls", "refused_calls"]

[rsi.anchors]
# baseline: the starter's val score (measured, see docs/tasks.md); reference: a perfect score.
baseline = 0.0
reference = 1.0

[rsi.noise]
# Two starter evaluations on the 480-question val disagree on 67 questions, a sampling noise of about
# 0.009 (paired bootstrap); sigma is set higher to leave room for run-to-run shifts, so the default
# rule accepts a val gain > 2 sigma = 0.03.
sigma = 0.015
repeats = 2

[rsi.splits]
dev = "dev"
val = "val"
test = "test"

[rsi.entrypoints]
prepare = "prepare.py"
evaluate = "tests/test.sh"
workspace = "environment/workspace"

[rsi.resources]
experiment_gpus_max = 0
eval_gpus = 0
model_access = true
eval_model_calls_max = 960      # 2 calls per question on val (480, the largest split); the evaluator's relay caps every split at 2 per question
