# Harbor-style task description plus the [rsi] extension used by agent-rsi-benchmarking.
schema_version = "1.3"

[task]
name = "rsib/iggt-tracking"
description = "Cross-view instance tracking on the IGGT 3D tracking benchmark (RGB only); T-mIoU."
authors = [{ name = "Flex-RSI" }]

[agent]
timeout_sec = 36000.0

[environment]
cpus = 16
memory_mb = 65536
gpus = 1

[verifier]
timeout_sec = 3600.0

[scoring]
metric = "t_miou"
direction = "higher"

[rsi]
id = "iggt-tracking"
domain = "vision/3d-tracking"
tier = "M"
artifact = "code"
verifier_tier = "exact"

[rsi.metric]
primary = "t_miou"
direction = "maximize"
secondary = ["t_sr", "J", "F", "JF"]

[rsi.anchors]
baseline = 0.193523   # colour-clustering starter on val (`rsib task calibrate --backend slurm`)
reference = 0.8579    # best known method on the benchmark, val T-mIoU

[rsi.noise]
sigma = 0.0        # the starter is deterministic
repeats = 1

[rsi.splits]
dev = "dev"
val = "val"
test = "test"

[rsi.entrypoints]
prepare = "prepare.py"
evaluate = "tests/test.sh"
workspace = "environment/workspace"

[rsi.resources]
experiment_gpus_max = 1
eval_gpus = 1
container = "pytorch"
