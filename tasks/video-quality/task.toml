# Harbor-style task description plus the [rsi] extension used by agent-rsi-benchmarking.
schema_version = "1.3"

[task]
name = "rsib/video-quality"
description = "Judge the perceptual quality of videos under a frame budget per model call: score real user-generated videos (YouTube-UGC MOS) and compare pairs of AI-generated videos (Veo 3.1 human-preference votes); mean of SRCC and pairwise accuracy."
authors = [{ name = "Flex-RSI" }]

[agent]
timeout_sec = 36000.0

[environment]
cpus = 8
memory_mb = 32768
gpus = 1

[verifier]
timeout_sec = 5400.0            # the evaluator itself stops the solver after 3600 s per split

[scoring]
metric = "score"
direction = "higher"

[rsi]
id = "video-quality"
domain = "vision/video-quality"
tier = "S"
artifact = "code"
verifier_tier = "exact"

[rsi.metric]
primary = "score"
direction = "maximize"
secondary = ["srcc", "pair_accuracy", "model_calls"]
public = ["srcc", "plcc", "pair_accuracy", "acc_alignment", "acc_artifacts", "acc_preference",
          "n_videos", "n_pairs", "n_judgments", "answered", "model_calls", "refused_calls"]

[rsi.anchors]
# Model-independent anchors: chance (SRCC 0, pairwise accuracy 0.5) and a perfect score. The
# starter's score depends on the model under test (round 0 of each run records it).
baseline = 0.25
reference = 1.0

[rsi.noise]
sigma = 0.02       # provisional; to be measured from repeated starter evaluations on val
repeats = 3

[rsi.splits]
dev = "dev"
val = "val"
test = "test"

[rsi.entrypoints]
prepare = "prepare.py"
evaluate = "tests/test.sh"
workspace = "environment/workspace"

[rsi.resources]
experiment_gpus_max = 1
eval_gpus = 1                   # a solution may run open models while evaluated
model_access = true
eval_model_calls_max = 180      # 3 calls per item of a split (dev 45, val 45, test 60)
container = "pytorch"
