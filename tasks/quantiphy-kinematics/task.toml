# Harbor-style task description plus the [rsi] extension used by agent-rsi-benchmarking.
schema_version = "1.3"

[task]
name = "rsib/quantiphy-kinematics"
description = "Infer sizes, distances, velocities and accelerations in physical units from short videos plus one physical prior, with a fixed open VLM (Qwen3.8-27B) as the only language model (QuantiPhy validation); mean relative accuracy."
authors = [{ name = "Flex-RSI" }]

[agent]
timeout_sec = 86400.0

[environment]
cpus = 16
memory_mb = 131072
gpus = 1

[verifier]
timeout_sec = 3600.0            # the evaluator itself stops the solver after 2700 s per split

[scoring]
metric = "mra"
direction = "higher"

[rsi]
id = "quantiphy-kinematics"
domain = "reasoning/physical-quantities"
tier = "L"
artifact = "code"
verifier_tier = "exact"

[rsi.metric]
primary = "mra"
direction = "maximize"
secondary = ["mra_ss", "mra_sd", "mra_ds", "mra_dd", "model_calls"]
public = ["n", "answered", "model_calls", "refused_calls"]

[rsi.anchors]
# baseline: the starter (fixed Qwen3.8-27B backbone, thinking off) on the 52-question val split, 5 repeats
# with `rsib task calibrate` on 8 x B200; reference: a perfect score.
baseline = 0.283462
reference = 1.0

[rsi.noise]
sigma = 0.0365809
repeats = 5

[rsi.splits]
dev = "dev"
val = "val"
test = "test"

[rsi.entrypoints]
prepare = "prepare.py"
evaluate = "tests/test.sh"
workspace = "environment/workspace"

[rsi.resources]
experiment_gpus_max = 2
eval_gpus = 1                   # a solution may run open vision tools (trackers, depth) while evaluated
# fixed backbone: Qwen/Qwen3.8-27B at revision 1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0, served by
# vLLM outside the run; evaluators and phases get FIXED_VLM_URL / FIXED_VLM_MODEL via RSIB_PASS_ENV
model_access = false
