schema_version = "1.3"

[task]
name = "rsib/libero-max-agent"
description = "Agent-as-policy on paired LIBERO-MAX: frozen X-VLA plus the run's model, calibrated cameras and depth"
authors = [{ name = "Flex-RSI" }]

[agent]
timeout_sec = 129600.0

[environment]
cpus = 16
memory_mb = 131072
gpus = 1

[verifier]
timeout_sec = 28800.0           # one evaluation; model-calling episodes are slow

[scoring]
metric = "dynamic_success_rate"
direction = "higher"

[rsi]
id = "libero-max-agent"
domain = "robotics/libero"
tier = "L"
artifact = "code"
verifier_tier = "exact"

[rsi.metric]
primary = "dynamic_success_rate"
direction = "maximize"
secondary = ["base_success_rate", "paired_delta", "coverage", "dynamic_model_queries"]
public = ["policy_model_calls", "policy_model_live_calls", "policy_model_refused", "policy_model_failures", "episode_time_limits", "base_success_rate", "paired_delta", "planned_pairs", "completed_pairs", "coverage", "trigger_unreached", "response_query_unreached", "rollouts", "base_model_queries", "dynamic_model_queries", "dynamic_replay_queries", "base_model_query_elapsed_s", "dynamic_model_query_elapsed_s", "mean_query_delay_steps", "repaired_pairs", "regressed_pairs", "wall_s"]

[rsi.splits]
dev = "dev"
val = "val"
test = "test"

[rsi.entrypoints]
prepare = "prepare.py"
evaluate = "tests/test.sh"
workspace = "environment/workspace"

[rsi.resources]
experiment_gpus_max = 1
eval_gpus = 1
model_access = true
eval_model_calls_max = 800      # planned episodes x 16 calls each (tests/evaluate.py), with margin
