# Harbor-style task description plus the [rsi] extension used by agent-rsi-benchmarking.
schema_version = "1.3"

[task]
name = "rsib/egoexomem"
description = "Answer memory questions about synchronized egocentric and exocentric cooking and bike-repair videos (EgoExoMem, EgoExo4D part) under a frame budget per model call; accuracy."
authors = [{ name = "Flex-RSI" }]

[agent]
timeout_sec = 36000.0

[environment]
cpus = 8
memory_mb = 32768
gpus = 1

[verifier]
timeout_sec = 5400.0            # the evaluator itself stops the solver after 3600 s per split

[scoring]
metric = "accuracy"
direction = "higher"

[rsi]
id = "egoexomem"
domain = "vision/video-reasoning"
tier = "S"
artifact = "code"
verifier_tier = "exact"

[rsi.metric]
primary = "accuracy"
direction = "maximize"
secondary = ["acc_cooking", "acc_bike", "model_calls"]
public = ["acc_cooking", "acc_bike", "acc_habitual_location", "acc_instantaneous_position",
          "acc_resulting_location", "acc_egocentric_direction", "acc_object_state",
          "acc_allocentric_relation", "acc_temporal_ordering", "n", "answered", "model_calls",
          "refused_calls"]

[rsi.anchors]
# Model-independent anchors: chance (four options) and a perfect score. The starter's score
# depends on the model under test (round 0 of each run records it).
baseline = 0.25
reference = 1.0

[rsi.noise]
sigma = 0.02       # provisional; to be measured from repeated starter evaluations on val
repeats = 3

[rsi.splits]
dev = "dev"
val = "val"
test = "test"

[rsi.entrypoints]
prepare = "prepare.py"
evaluate = "tests/test.sh"
workspace = "environment/workspace"

[rsi.resources]
experiment_gpus_max = 1
eval_gpus = 1                   # a solution may run open models (frame retrieval, detectors) while evaluated
model_access = true
eval_model_calls_max = 360      # 3 calls per question of a split (dev 80, val 80, test 120)
container = "pytorch"
