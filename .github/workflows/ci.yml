name: ci

# A change that touches only documentation runs no tests.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e '.[dev]'
      - name: Configure git identity for test repositories
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@users.noreply.github.com"
      - name: Test
        run: pytest -q
